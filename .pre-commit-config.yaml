# .pre-commit-config.yaml — git hooks managed by prek (Rust drop-in for pre-commit)
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
    # ---- COMMIT: changed files only ----
      - id: ruff-check
        name: ruff check (lint - changed files)
        stages: [pre-commit]
        args: [--fix, --exit-non-zero-on-fix, --config=./linter_ruff.toml]

      - id: ruff-format
        name: ruff format (format - changed files)
        stages: [pre-commit]
        args: [--config=./linter_ruff.toml]

    # ---- PUSH: whole project ----
      - id: ruff-check
        name: ruff check (lint - all files)
        stages: [pre-push]
        args: [--no-cache, --fix, --exit-non-zero-on-fix, --config=./linter_ruff.toml]
        pass_filenames: false

      - id: ruff-format
        name: ruff format (format - all files)
        stages: [pre-push]
        args: [--config=./linter_ruff.toml]
        pass_filenames: false

  - repo: local
    hooks:
      # wemake-python-styleguide (WPS) поверх flake8, конфиг .flake8,
      # только WPS-коды (--select=WPS — документированный способ запуска).
      # Зависимость — dev-group pyproject (wemake-python-styleguide==1.9.0).
    # ---- COMMIT: changed files only ----
      - id: wps-flake8-check
        name: wps flake8 check (lint - changed files)
        entry: uv run --no-sync flake8 --config=.flake8 --select=WPS
        language: system
        types: [python]
        stages: [pre-commit]

    # ---- PUSH: whole project ----
      - id: wps-flake8-check-all
        name: wps flake8 check (lint - all files)
        entry: uv run --no-sync flake8 --config=.flake8 --select=WPS --count
        language: system
        types: [python]
        stages: [pre-push]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-json
        # tests/data/settings_invalid_not_invalid_json.json — намеренно битый fixture для теста Settings
        exclude: ^tests/data/settings_invalid_not_invalid_json\.json$
      - id: name-tests-test
        args: [--pytest-test-first]
