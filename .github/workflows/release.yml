name: release

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Determine version from pyproject.toml
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "App version: $VERSION"

      - name: Check release tag
        id: tag
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/EyesGuard-v$VERSION" > /dev/null 2>&1; then
            echo "Tag EyesGuard-v$VERSION already exists, skipping release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag EyesGuard-v$VERSION does not exist, release will be built"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Sync dependencies
        if: steps.tag.outputs.skip == 'false'
        run: uv sync --frozen

      - name: Tests (pytest)
        if: steps.tag.outputs.skip == 'false'
        run: uv run pytest

      - name: Build onefile exe
        if: steps.tag.outputs.skip == 'false'
        run: uv run pyinstaller EyesGuard-onefile.spec

      - name: Rename onefile exe
        if: steps.tag.outputs.skip == 'false'
        shell: bash
        run: mv dist/EyesGuard.exe "dist/EyesGuard-v$VERSION-win64.exe"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build onedir bundle
        if: steps.tag.outputs.skip == 'false'
        run: uv run pyinstaller EyesGuard-onedir.spec

      - name: Pack onedir zip
        if: steps.tag.outputs.skip == 'false'
        shell: pwsh
        run: |
          Rename-Item -Path 'dist/EyesGuard' -NewName "EyesGuard-v$env:VERSION"
          Compress-Archive -Path "dist/EyesGuard-v$env:VERSION" -DestinationPath "dist/EyesGuard-v$env:VERSION-win64.zip"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Extract changelog section
        if: steps.tag.outputs.skip == 'false'
        shell: bash
        run: |
          python - "$VERSION" <<'PY'
          import re
          import sys
          import pathlib

          version = sys.argv[1]
          text = pathlib.Path('CHANGELOG.md').read_text(encoding='utf-8')
          pattern = r'## \[' + re.escape(version) + r'\][^\n]*\n(.*?)(?=\n## |\Z)'
          match = re.search(pattern, text, re.S)
          notes = match.group(1).strip() if match else f'EyesGuard v{version}'
          pathlib.Path('release_notes.md').write_text(notes, encoding='utf-8')
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Create GitHub release
        if: steps.tag.outputs.skip == 'false'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: EyesGuard-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: EyesGuard v${{ steps.version.outputs.version }}
          body_path: release_notes.md
          files: |
            dist/EyesGuard-v${{ steps.version.outputs.version }}-win64.exe
            dist/EyesGuard-v${{ steps.version.outputs.version }}-win64.zip
