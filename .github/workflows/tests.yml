name: tests

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_call:

jobs:
  lint-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Sync dependencies (locked)
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run --no-sync ruff check . --config=./linter_ruff.toml

      - name: Format check (ruff format)
        run: uv run --no-sync ruff format --check . --config=./linter_ruff.toml

      - name: Tests (pytest)
        run: uv run --no-sync pytest
