[project]
name = "eyeguard"
version = "2.1.0"
description = "EyesGuard: desktop reminders to take breaks during PC work (Windows 10)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = [
    "customtkinter==5.2.0",
    "loguru==0.7.2",
    "pillow>=10.0.0",
    "pydantic==2.1.1",
    "pystray==0.19.4",
]

[dependency-groups]
dev = [
    "pyinstaller==6.22.3",
    "pytest==7.4.0",
    # версия синхронизирована с rev в .pre-commit-config.yaml (ruff-pre-commit)
    "ruff==0.16.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

